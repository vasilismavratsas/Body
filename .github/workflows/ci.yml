name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:unit

      # Separate step: long Monte Carlo golden must not share a vitest worker
      # with the unit suite (avoids "Timeout calling onTaskUpdate" flakes).
      - name: Golden criterion (8 seeds, nDraws 4000)
        run: npm run test:golden
        timeout-minutes: 20

      - name: Build
        run: npm run build
